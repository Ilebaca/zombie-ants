name: Validate economy balance
on:
  push:
    branches: [economy-audit-20261112]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/platform/__tests__/economy.test.ts src/platform/__tests__/progression.test.ts src/platform/__tests__/profile.test.ts src/ui/__tests__/meta.test.ts
      - run: npx tsx tools/economy.ts 540 > /tmp/balanced-economy.json
      - name: Summarise pacing and seeded variation
        shell: python
        run: |
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/balanced-economy.json').read_text())
          print('SINKS', json.dumps(data['sinks']))
          for row in data['scenarios']:
            print('SCENARIO', json.dumps({key: row[key] for key in ('name','matches','wins','firstPurchaseDay','speciesDays','mainMaxDay','chambersMaxDay','freeResearchMaxDay','roadCompleteDay','earned')}))
          print('COHORT', json.dumps(data['cohort']))
      - uses: actions/upload-artifact@v4
        with:
          name: balanced-economy-projections
          path: /tmp/balanced-economy.json
