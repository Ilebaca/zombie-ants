name: Validate inline traits
on:
  push:
    branches: [inline-traits-20261112]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/ui/__tests__/traits.test.ts src/ui/__tests__/back.test.ts src/ui/__tests__/meta.test.ts src/platform/__tests__/traits.test.ts src/platform/__tests__/profile.test.ts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/optimize_images.py
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: inline-traits-preview
          path: dist/
          retention-days: 7
