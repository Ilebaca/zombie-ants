name: Chapter AI validation
on:
  push:
    branches: [development/chapter-ai-power]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx tools/ai-probe.ts
      - uses: actions/upload-artifact@v4
        with:
          name: chapter-ai-probe
          path: reports/
