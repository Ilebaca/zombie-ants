name: Chapter AI validation
on:
  push:
    branches: [development/chapter-ai-power]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: chapter-ai-web
          path: dist/
          retention-days: 7
  balance:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        from: [1,6,11,16,21,26,31,36,41,46]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx tools/chapter-balance.ts ${{ matrix.from }}
      - uses: actions/upload-artifact@v4
        with:
          name: chapter-balance-${{ matrix.from }}
          path: reports/
          retention-days: 7
  report:
    needs: balance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: chapter-balance-*
          merge-multiple: true
          path: reports/
      - run: |
          python - <<'PY'
          import glob,json
          reports=[json.load(open(p)) for p in glob.glob('reports/chapter-*.json')]
          chapters=sorted([c for r in reports for c in r['chapters']],key=lambda c:c['chapter'])
          assert [c['chapter'] for c in chapters]==list(range(1,51))
          bands=[]
          for lo,hi in [(1,5),(6,15),(16,30),(31,40),(41,50)]:
              games=[g for c in chapters if lo<=c['chapter']<=hi for g in c['results']]
              bands.append(dict(chapters=[lo,hi],games=len(games),playerScore=sum(g['score'] for g in games)/len(games),draws=sum(not g['decisive'] for g in games),maxThinkMs=max(g['maxThinkMs'] for g in games)))
          summary=dict(chapters=chapters,bands=bands,skillAblation=[r['skillAblation'] for r in reports],gearAblation=[r['gearAblation'] for r in reports])
          json.dump(summary,open('reports/summary.json','w'),indent=2)
          print(json.dumps(dict(bands=bands,skillScore=sum(r['skillAblation']['score'] for r in reports)/len(reports),gearScore=sum(r['gearAblation']['score'] for r in reports)/len(reports))))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter-balance-report
          path: reports/
          retention-days: 7
