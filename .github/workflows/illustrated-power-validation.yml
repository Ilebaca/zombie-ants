name: Illustrated power validation
on:
  push:
    branches: [development/illustrated-power-fire]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run src/ui/__tests__/power-tag.test.ts
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: illustrated-power-preview
          path: dist
