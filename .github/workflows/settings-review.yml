name: Settings and hatch review
on:
  push:
    branches: [fix/settings-icons-hatch-rewards]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: settings-review-web
          path: dist/
          retention-days: 7
