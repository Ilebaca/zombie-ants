name: Validate trait picker
on:
  push:
    branches: [trait-picker-20261112]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/ui/__tests__/traits.test.ts src/ui/__tests__/back.test.ts src/ui/__tests__/meta.test.ts
      - name: Verify browsing cannot silently equip
        run: |
          cp src/ui/traits.ts "$RUNNER_TEMP/original-traits.ts"
          python - <<'PY'
          from pathlib import Path
          p = Path("src/ui/traits.ts")
          s = p.read_text()
          assert "    returnFocus = source;" in s
          p.write_text(s.replace("    returnFocus = source;", "    returnFocus = source;\n    store.equipTrait(scope, item.uid, selectedSlot ?? undefined);"))
          PY
          set +e
          npx vitest run src/ui/__tests__/traits.test.ts -t "shows the actual rarity, effect and biology before equipping"
          result=$?
          set -e
          cp "$RUNNER_TEMP/original-traits.ts" src/ui/traits.ts
          test "$result" -eq 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/optimize_images.py
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: trait-picker-preview
          path: dist/
          retention-days: 7
