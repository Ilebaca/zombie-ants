name: Power tag validation
on:
  push:
    branches: [development/power-tags]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run src/ui/__tests__/power-tag.test.ts src/ui/__tests__/traits.test.ts src/ui/__tests__/matchmaking.test.ts src/ui/__tests__/setup.test.ts
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: power-tag-web
          path: dist/
