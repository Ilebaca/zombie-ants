name: Clear splash review
on:
  push:
    branches: [codex/clear-splash-overlay]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run src/platform/__tests__/splash.test.ts
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: clear-splash-review
          path: dist/
          retention-days: 7
