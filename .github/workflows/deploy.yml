name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployment needs these; GITHUB_TOKEN gets read-only defaults otherwise.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs finish so a deploy is not left half-done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20: jsdom (the UI tests' DOM) ships an undici that calls
      # webidl.util.markAsUncloneable, which does not exist on Node 20 — the UI suite
      # crashed on the runner while passing locally. Actions is retiring Node 20 anyway.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # All three gate the deploy: a red build must never reach the public URL. Lint is
      # here for the architecture rules it carries (eslint.config.js) as much as the style
      # ones — a layer violation is a design bug, and it should fail like one.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - run: npm run build

      # The TypeScript build is the game now. The legacy single-file build ships beside it
      # at /legacy.html because it is still the behavioural reference for anything not
      # ported (CLAUDE.md §1) — and it costs one file to keep it playable.
      - run: cp legacy/zombie-ants-pro.html dist/legacy.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
