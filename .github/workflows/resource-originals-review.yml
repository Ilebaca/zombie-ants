name: Resource originals review
on:
  push:
    branches: [codex/restore-resource-originals]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tools -p 'test_optimize_images.py'
      - run: python tools/optimize_images.py src/ui/hud src/ui/shelf
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: resource-originals-review
          path: dist/
          retention-days: 7
