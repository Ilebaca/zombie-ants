name: CDR balance validation
on:
  push:
    branches: [development/cdr-trait-balance]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run src/engine/__tests__/power.test.ts src/engine/__tests__/traits.test.ts src/engine/__tests__/research.test.ts src/platform/__tests__/traits.test.ts src/platform/__tests__/campaign-ai.test.ts src/ui/__tests__
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: cdr-balance-preview
          path: dist
