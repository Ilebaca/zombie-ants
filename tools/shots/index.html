<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Zombie Ants — screen export</title>
<!--
  THE SAME DOCUMENT THE GAME SHIPS IN, minus the things an export must not have.

  It carries the two `@font-face` rules and the `#splash` / `#rotate` markup verbatim,
  because both are in the real document rather than built by the app (index.html says why)
  — an export harness without them would hand back screens set in Arial and could not show
  the cover or the rotate shade at all. What it leaves out is the manifest, the icons and
  the ten-second splash watchdog: nothing here installs, and the cover is removed by a
  scene rather than by a timer.

  The font paths are absolute because this page is served from /tools/shots/ while
  `public/` is served at the root.
-->
<style>
@font-face {
  font-family: Nunito; font-style: normal; font-weight: 400 900; font-display: block;
  src: url(/fonts/nunito-latin-ext.woff2) format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: Nunito; font-style: normal; font-weight: 400 900; font-display: block;
  src: url(/fonts/nunito-latin.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
  #splash {
    position: fixed; inset: 0; z-index: 9998; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    background: #0e1a12; color: #eaf3ea;
    font-family: Nunito, system-ui, sans-serif;
  }
  #splash.off { display: none; }
  #splash .sp-mark { display: flex; align-items: baseline; gap: 8px; line-height: 1; }
  #splash .sp-mark b { font-size: 34px; font-weight: 900; letter-spacing: -.5px; }
  #splash .sp-mark span { font-size: 34px; font-weight: 900; letter-spacing: 5px; color: #7ee787; }
  #splash .sp-bar { width: 132px; height: 3px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
  #splash .sp-bar i { display: block; width: 40%; height: 100%; border-radius: 999px; background: #7ee787; transform: translateX(60%); }
</style>
</head>
<body>
<div id="app"></div>
<div id="splash" class="off" aria-hidden="true">
  <div class="sp-mark"><b>ZOMBIE</b><span>ANTS</span></div>
  <div class="sp-bar"><i></i></div>
</div>
<div id="rotate" aria-live="polite">
  <div class="rot-mark" aria-hidden="true"></div>
  <div class="rot-h">Turn your device upright</div>
  <div class="rot-p">Zombie Ants is played in portrait — the board is square and the colony reads down the screen.</div>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
