<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!--
  THE THEME COLOUR IS THE SOIL the whole game is played on, so the status bar and the
  splash behind an installed app are the same ground as the board rather than a black band.
-->
<meta name="theme-color" content="#0e1a12">
<meta name="description" content="Two ant colonies fight for one grid, and a queen infected with a real parasitic fungus sleeps in the middle.">

<!--
  INSTALLING IS WHAT KEEPS AN iPHONE COLONY ALIVE (platform/persistence.ts): Safari deletes
  a site's storage after about a week away, and adding it to the Home Screen is the only
  thing that exempts it. The app asks players to do exactly that, so the three tags that
  make it work are not optional decoration:

  - the MANIFEST gives it a name, an icon and `display: standalone`. Without standalone,
    an installed app opens in browser chrome and `navigator.standalone` stays FALSE — so
    the app could not tell it had been installed, and the warning would nag for ever at
    the player who had already done what it asked.
  - `apple-mobile-web-app-capable` is the same instruction for the versions of iOS that do
    not read the manifest. Both, because neither covers every phone.
  - `apple-touch-icon` MUST be a PNG. iOS ignores an SVG here and uses a blurry screenshot
    of the page instead, which is the difference between an app and a bookmark.
-->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zombie Ants">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>Zombie Ants</title>

<!--
  THE COVER, AND IT IS IN THE DOCUMENT WITH ITS STYLES INLINE.

  `#app` is empty until the bundle has been fetched, parsed and run — so a cold load showed
  a bare dark rectangle for as long as that took, which on a phone is most of a second and
  on the Android shell comes after a white flash of its own. Nothing said the game was
  starting; it just looked broken for a moment.

  It cannot be built by the app, for the same reason `#rotate` cannot: whatever the app
  builds arrives at exactly the moment the app does, which is the moment this stops being
  needed. And its styles are INLINE rather than in `skin.css`, because that stylesheet is
  emitted by the bundler and is another file to wait for — the one thing a cover must not
  do is wait.

  IT IS THE WORDMARK, DRAWN, with no image and no icon file. Everything else in this game
  is drawn by the code that owns it, and an <img> here would be a second request that can
  land after the thing it was meant to cover. The type matches the home screen's own mark
  so the cover hands over to it rather than being replaced by it.

  THE BAR IS INDETERMINATE ON PURPOSE. There is no honest percentage to show — the browser
  does not tell a page how much of its own script has arrived — and a fake one that jumps
  to 90% and waits is worse than a sweep that only says "working".

  It is removed by `platform/splash.ts`, never merely hidden, or it would sit over the game
  swallowing taps. The watchdog at the foot of this file is the failsafe: a cover that can
  outlive a boot that went wrong is worse than no cover at all.
-->
<style>
  #splash {
    position: fixed;
    inset: 0;
    z-index: 9998;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: #0e1a12;
    color: #eaf3ea;
    font-family: Nunito, system-ui, -apple-system, "Segoe UI", sans-serif;
    transition: opacity .28s ease;
  }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash .sp-mark {
    display: flex;
    align-items: baseline;
    gap: 8px;
    line-height: 1;
  }
  #splash .sp-mark b { font-size: 34px; font-weight: 900; letter-spacing: -.5px; }
  #splash .sp-mark span {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #7ee787;
  }
  #splash .sp-bar {
    width: 132px;
    height: 3px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .12);
    overflow: hidden;
  }
  #splash .sp-bar i {
    display: block;
    width: 40%;
    height: 100%;
    border-radius: 999px;
    background: #7ee787;
    animation: sp-sweep 1.15s ease-in-out infinite;
  }
  @keyframes sp-sweep {
    0%   { transform: translateX(-105%); }
    100% { transform: translateX(355%); }
  }
  /* A player who has asked for less movement gets a still bar rather than none: the
     track still says the game is doing something, it simply does not run. */
  @media (prefers-reduced-motion: reduce) {
    #splash .sp-bar i { animation: none; width: 100%; opacity: .55; }
  }
</style>
<!--
  THE TYPEFACE IS OURS NOW, and taking it off Google's CDN was the point.

  It was two `preconnect`s and a stylesheet from fonts.googleapis.com, which is the one
  third-party embed this app had — and it meant every player's IP address reached Google
  before a line of the game ran, with no consent asked for and none of it necessary. That
  is the textbook GDPR problem with hosted webfonts, and a German court has already ruled
  on exactly it. The privacy page had to list Google as a recipient purely because of these
  three lines. It does not any more.

  It also made two other things true rather than nearly true. The game claims to play with
  no network; it now does, including inside the Android shell, where this was a call over
  the internet to render the first screen. And a render-blocking stylesheet on somebody
  else's server was the slowest thing in the boot.

  ONE VARIABLE FILE PER SUBSET, latin and latin-ext, 80 KB the build serves itself. Google
  returns the SAME woff2 for 400, 700, 800 and 900 — four identical downloads behind four
  rules — so declaring the weight RANGE is what makes it one file. Anything outside those
  two subsets falls to the stack below, which is what a fallback is for.
-->
<style>
/* latin-ext */
@font-face {
  font-family: Nunito;
  font-style: normal;
  /* ONE VARIABLE FILE COVERS THE WHOLE RANGE. Google serves the same woff2 for 400, 700,
     800 and 900 — four identical downloads under four @font-face rules. Declaring the
     range is what makes it one file instead. */
  font-weight: 400 900;
  font-display: swap;
  src: url(./fonts/nunito-latin-ext.woff2) format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
/* latin */
@font-face {
  font-family: Nunito;
  font-style: normal;
  /* ONE VARIABLE FILE COVERS THE WHOLE RANGE. Google serves the same woff2 for 400, 700,
     800 and 900 — four identical downloads under four @font-face rules. Declaring the
     range is what makes it one file instead. */
  font-weight: 400 900;
  font-display: swap;
  src: url(./fonts/nunito-latin.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
</style>
</head>
<body>
<div id="app"></div>

<div id="splash" aria-hidden="true">
  <div class="sp-mark"><b>ZOMBIE</b><span>ANTS</span></div>
  <div class="sp-bar"><i></i></div>
</div>
<!--
  THE GAME IS PLAYED UPRIGHT (see skin.css). In the document rather than built
  by the app, so it is on screen before a single line of script has run: a phone
  held sideways while the bundle loads should never show the layout sideways,
  even for a frame.
-->
<div id="rotate" aria-live="polite">
  <div class="rot-mark" aria-hidden="true"></div>
  <div class="rot-h">Turn your device upright</div>
  <div class="rot-p">Zombie Ants is played in portrait — the board is square and the colony reads down the screen.</div>
</div>
<!--
  THE WATCHDOG. The app takes the cover down when it is ready (platform/splash.ts), and
  everything here is about the case where it never gets there: a bundle that 404s, a syntax
  error in an old browser, a boot that throws before the crash panel is armed. In every one
  of those the cover would sit on screen for ever, hiding the very thing that would say what
  went wrong. Ten seconds is far longer than any real boot and far shorter than a player's
  patience with a frozen screen.
-->
<script>
  setTimeout(function () {
    var el = document.getElementById("splash");
    if (el) el.remove();
  }, 10000);
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
