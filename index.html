<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!--
  THE THEME COLOUR IS THE SOIL the whole game is played on, so the status bar and the
  splash behind an installed app are the same ground as the board rather than a black band.
-->
<meta name="theme-color" content="#0e1a12">
<meta name="description" content="Two ant colonies fight for one grid, and a queen infected with a real parasitic fungus sleeps in the middle.">

<!--
  INSTALLING IS WHAT KEEPS AN iPHONE COLONY ALIVE (platform/persistence.ts): Safari deletes
  a site's storage after about a week away, and adding it to the Home Screen is the only
  thing that exempts it. The app asks players to do exactly that, so the three tags that
  make it work are not optional decoration:

  - the MANIFEST gives it a name, an icon and `display: standalone`. Without standalone,
    an installed app opens in browser chrome and `navigator.standalone` stays FALSE — so
    the app could not tell it had been installed, and the warning would nag for ever at
    the player who had already done what it asked.
  - `apple-mobile-web-app-capable` is the same instruction for the versions of iOS that do
    not read the manifest. Both, because neither covers every phone.
  - `apple-touch-icon` MUST be a PNG. iOS ignores an SVG here and uses a blurry screenshot
    of the page instead, which is the difference between an app and a bookmark.
-->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zombie Ants">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>Zombie Ants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div id="app"></div>
<!--
  THE GAME IS PLAYED UPRIGHT (see skin.css). In the document rather than built
  by the app, so it is on screen before a single line of script has run: a phone
  held sideways while the bundle loads should never show the layout sideways,
  even for a frame.
-->
<div id="rotate" aria-live="polite">
  <div class="rot-mark" aria-hidden="true"></div>
  <div class="rot-h">Turn your device upright</div>
  <div class="rot-p">Zombie Ants is played in portrait — the board is square and the colony reads down the screen.</div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
